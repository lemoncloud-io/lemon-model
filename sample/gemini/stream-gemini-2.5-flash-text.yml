  response:
    text: |-
      Here are 8 kinds of "hello," varying in formality, region, and context:

      1.  **The Classic:** **Hello.**
          *   *Usage:* Standard, versatile, can be used in almost any situation, polite.

      2.  **The Casual:** **Hi!** or **Hey!**
          *   *Usage:* Informal, friendly, common among friends, family, or in casual settings. "Hey" can also be used to get someone's attention.

      3.  **The Formal/Polite:** **Good morning/afternoon/evening.**
          *   *Usage:* Respectful, time-specific, used in professional settings, when meeting elders, or in customer service.

      4.  **The Enthusiastic:** **Well, hello there!** or **Helloooo!** (with a prolonged 'o')
          *   *Usage:* Conveys surprise, warmth, or excitement, often when you haven't seen someone in a while or are particularly pleased to see them.

      5.  **The Question-as-Greeting:** **How's it going?** or **What's up?** (often shortened to "Wassup?")
          *   *Usage:* Very informal, common among friends, serves as both a greeting and a casual inquiry about well-being. "What's up?" is more distinctly American slang.

      6.  **The Regional/Quirky:** **Howdy!**
          *   *Usage:* Informal, common in certain parts of the US (especially the South and West), evokes a friendly, folksy charm.

      7.  **The Group Greeting:** **Hello everyone!** or **Hi folks!**
          *   *Usage:* When addressing multiple people at once, good for meetings, gatherings, or starting a presentation.

      8.  **The Playful/Slightly Formal (often ironic):** **Greetings!** or **Salutations!**
          *   *Usage:* Can be used seriously in very formal written contexts, but often used playfully or ironically in spoken language to add a touch of old-fashioned charm or humor.
